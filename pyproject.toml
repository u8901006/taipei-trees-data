[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "taipei-trees-data"
version = "0.1.0"
description = "可稽核的臺北市樹木公開資料管線"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "anthropic>=0.34,<1",
  "beautifulsoup4>=4.12,<5",
  "httpx>=0.27,<1",
  "pandas>=2.2,<3",
  "pyarrow>=16,<20",
  "pypdf>=4.2,<6",
  "PyYAML>=6.0,<7",
  "psycopg[binary]>=3.2,<4",
  "SQLAlchemy>=2.0,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruff>=0.6,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
