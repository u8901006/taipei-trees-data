name: Monthly transparency gap report

"on":
  schedule:
    - cron: "0 2 1 * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: data-sync
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r scripts/requirements.txt
      - run: git pull --rebase origin "${GITHUB_REF_NAME}"
      - run: python scripts/gap_report.py --health reports/health.json --out reports/gaps.json
      - name: Commit only transparency gap report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/gaps.json
          git diff --cached --quiet || git commit -m "data: update transparency gap report"
          for attempt in 1 2 3; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" &&
               git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            git rebase --abort || true
            if [ "${attempt}" -eq 3 ]; then
              exit 1
            fi
            sleep "$((attempt * 2))"
          done
      - name: Upload safe failure diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: gap-diagnostics
          path: reports/
          if-no-files-found: ignore
