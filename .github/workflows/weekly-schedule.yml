name: Weekly pruning schedule

"on":
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: data-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r scripts/requirements.txt
      - run: git pull --rebase origin "${GITHUB_REF_NAME}"
      - name: Fetch configured pruning schedule (not configured is a no-op)
        env:
          TAIPEI_PRUNING_SCHEDULE_URL: ${{ vars.TAIPEI_PRUNING_SCHEDULE_URL }}
        run: python scripts/fetch_schedule.py --out raw/pruning_schedules/
      - name: Commit only schedule snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add raw/pruning_schedules/
          git diff --cached --quiet || git commit -m "data: update pruning schedules"
          for attempt in 1 2 3; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" &&
               git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            git rebase --abort || true
            if [ "${attempt}" -eq 3 ]; then
              exit 1
            fi
            sleep "$((attempt * 2))"
          done
      - name: Upload safe failure diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: schedule-diagnostics
          path: reports/
          if-no-files-found: ignore
